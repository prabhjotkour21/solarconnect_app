name: solarconnect_app
description: "SolarConnect - Solar energy monitoring and management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # ── Icons ──────────────────────────────────────────────────────────────────
  # Provides the Cupertino (Apple-style) icon set as a bonus alongside
  # Material icons. Useful for iOS-feel icons on certain UI elements.
  cupertino_icons: ^1.0.8

  # ── Charts ─────────────────────────────────────────────────────────────────
  # fl_chart: The best Flutter charting library. We use it for:
  #   - Line chart on Overview (energy production over time)
  #   - Bar chart on Explore (daily/weekly comparisons)
  #   - Pie chart for energy source breakdown
  fl_chart: ^0.70.2

  # ── Local Storage ──────────────────────────────────────────────────────────
  # shared_preferences: Saves key-value pairs on the device permanently.
  # We use it to store user settings (theme preference, unit system, etc.)
  # Works on Android, iOS, web, desktop — no setup required.
  shared_preferences: ^2.3.0

  # ── Date & Number Formatting ───────────────────────────────────────────────
  # intl: The official Dart internationalization package.
  # We use it to format:
  #   - Dates: "Monday, 23 Jun" or "14:30"
  #   - Numbers: "3,524.5 kWh" with proper decimal separators
  intl: ^0.20.1

  # ── Typography ─────────────────────────────────────────────────────────────
  # google_fonts: Downloads and caches Google Fonts at runtime.
  # We use "Inter" as the primary font — clean, modern, highly readable.
  # No need to download .ttf files manually.
  google_fonts: ^6.2.1

  # ── Progress Indicators ────────────────────────────────────────────────────
  # percent_indicator: Circular and linear progress bars with animation.
  # We use them for:
  #   - Battery level circle on Overview
  #   - Grid usage bar on Overview
  #   - Efficiency ring on Explore
  percent_indicator: ^4.2.4

  # ── Loading Skeletons ──────────────────────────────────────────────────────
  # shimmer: Creates a silver shimmer animation on placeholder widgets.
  # Shows while data is loading so the screen never looks blank/broken.
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # ── Assets ─────────────────────────────────────────────────────────────────
  # Declaring entire folders means any file you drop in is automatically
  # available — you don't have to list files one by one.
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  # ── Fonts ──────────────────────────────────────────────────────────────────
  # We declare Inter here as a fallback for offline use.
  # google_fonts will use the network version when available.
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
